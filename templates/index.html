<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Enquiry Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f5f7fb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .chat-container {
            width: 100%;
            max-width: 720px;
            height: 90vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #3f51b5;
            color: #ffffff;
            padding: 18px 20px;
        }

        .chat-header h1 {
            font-size: 1.25rem;
        }

        .chat-header p {
            font-size: 0.85rem;
            opacity: 0.85;
            margin-top: 4px;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f5f7fb;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #3f51b5;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: #ffffff;
            color: #222222;
            border: 1px solid #e3e6ee;
            border-bottom-left-radius: 4px;
        }

        .message.error {
            background: #fdecea;
            color: #b71c1c;
            border-color: #f5c6cb;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid #e3e6ee;
            background: #ffffff;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cfd4e2;
            border-radius: 24px;
            font-size: 0.95rem;
            outline: none;
        }

        .input-area input:focus {
            border-color: #3f51b5;
        }

        .input-area button {
            padding: 0 22px;
            border: none;
            border-radius: 24px;
            background: #3f51b5;
            color: #ffffff;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .input-area button:hover {
            background: #303f9f;
        }

        .input-area button:disabled {
            background: #9fa8da;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🎓 College Enquiry Chatbot</h1>
            <p>Ask about admissions, courses, fees, campus life and placements</p>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your question here..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");

        let history = [];

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = "message " + type;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, "user");
            userInput.value = "";
            sendBtn.disabled = true;

            const typing = addMessage("Typing...", "bot");

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: message, history: history })
                });
                const data = await response.json();
                typing.remove();

                if (data.reply) {
                    addMessage(data.reply, "bot");
                    history.push({ role: "user", text: message });
                    history.push({ role: "model", text: data.reply });
                } else {
                    addMessage(data.error || "Something went wrong.", "bot error");
                }
            } catch (error) {
                typing.remove();
                addMessage("Unable to reach the server. Please try again.", "bot error");
            }

            sendBtn.disabled = false;
            userInput.focus();
        }

        sendBtn.addEventListener("click", sendMessage);
        userInput.addEventListener("keypress", function (event) {
            if (event.key === "Enter") sendMessage();
        });

        addMessage("Hello! 👋 I'm CollegeBuddy. How can I help you with your college enquiry today?", "bot");
    </script>
</body>
</html>
